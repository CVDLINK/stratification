# yaml-language-server: $schema=../model-description.schema.json
#
# ─────────────────────────────────────────────────────────────────────────────
# ILLUSTRATIVE EXAMPLE — mock data for format evaluation.
# NOT a real model. Resembles a CVDLINK D4.1 "unsupervised subgroup / biomarker
# discovery" model. All names, numbers, datasets and institutions are fictional.
#
# Type shown: unsupervised DISCOVERY delivered as a RESEARCH TOOL
#   → activates the `discovery` module (no prediction target); metrics are
#     internal-validity / enrichment statistics, not accuracy.
#   → NO deployment/governance: it makes no decisions about individuals.
# ─────────────────────────────────────────────────────────────────────────────

card_metadata:
  card_version: "1.0.0"
  card_language: en
  card_publisher: "CVDLINK Consortium"

identity:
  system_name: "EXAMPLE — OmicClust Multi-Omics Subgroup Discovery"
  short_title: "EXAMPLE OmicClust"
  short_description: >-
    An unsupervised ensemble-biclustering tool that surfaces candidate patient
    subgroups and co-varying biomarker modules from multi-omics data.
    Illustrative example of a research discovery tool, not a predictor.
  version: "1.0.0"
  modality: software
  model_type: discovery
  artifact_role: research_tool
  ai_techniques:
    - "Unsupervised learning"
    - "Ensemble biclustering"
    - "Consensus clustering"
    - "Multi-omics integration"
  keywords:
    - multi-omics
    - subgroup discovery
    - biclustering
    - unsupervised
    - biomarkers

provenance:
  providers:
    - "CVDLINK Consortium"
  developers:
    - "Helix Multi-Omics Centre (example)"
  contacts:
    - name: "S. Petrova (example)"
      institution: "Helix Multi-Omics Centre"
      email: "s.petrova@example.org"
  funding: "EU Horizon Europe — CVDLINK (GA 101137278)"

intended:
  domain: "Cardiovascular multi-omics research"
  purpose: "Discover unsupervised patient subgroups and co-regulated biomarker modules across genomic, methylation, proteomic and metabolomic layers, to generate research hypotheses."
  capability: "Ensemble biclustering with consensus aggregation over multiple omics matrices; no labels used."
  out_of_scope_uses:
    - "Predicting outcomes or risk for an individual patient"
    - "Any decision-making about individuals"
    - "Clinical stratification without prospective validation"
  surrogate_marker:
    predicts: false
    details: "It does not predict anything; it surfaces candidate subgroups and biomarker modules for research."

io:
  input_description: "Multiple aligned omics matrices (genomic, methylation, proteomic, metabolomic) for a patient cohort."
  output_description: "A set of candidate patient subgroups and associated co-varying biomarker modules, with stability and enrichment statistics."

components:
  - { name: "OmicClust-Engine", type: model, version: "1.0.0", documentation_link: "internal://models/omicclust-engine/model-card" }
  - { name: "PanOmics-Proxy Cohort", type: dataset, version: "1.0.0", documentation_link: "internal://datasets/panomics-proxy/datasheet" }
  - { name: "SimOmics Generator", type: system, version: "0.9.0", documentation_link: "internal://systems/simomics/docs" }

data:
  datasets:
    - name: "PanOmics-Proxy Cohort"
      description: "Public multi-omics cohort used as a proxy, standing in for CVD multi-omics cohorts that are not yet available."
      cohort: >-
        Public multi-omics cohort drawn from a non-cardiovascular disease area and used as a
        proxy; predominantly European ancestry. No cardiovascular phenotypes are present, so
        the composition differs from the intended CVD target population.
      origin: proxy
      availability: public
      location_or_request: "Openly available multi-omics repository (fictional example)."
      used_for_training: true
      bias_checked: true
      bias_details: "Proxy cohort; ancestry and platform composition documented and known to differ from the target CVD population."
      n_samples: "820"
      n_features: "45000"
      preprocessing:
        - "Per-omics normalization"
        - "Feature filtering (low-variance removal)"
        - "Cross-omics sample alignment"
      personal_data: false
      non_personal_data: true
    - name: "SimOmics Synthetic Set"
      description: "Simulated multi-omics data with planted co-regulated modules, used to test recovery of known structure."
      origin: simulated
      simulated_how: "Generated by planting known biclusters/modules into correlated Gaussian omics layers with controlled noise."
      availability: none
      used_for_training: false
      bias_checked: true
      bias_details: "Ground-truth structure is known by construction; used only to measure recovery."
      n_samples: "500"
      n_features: "30000"
      personal_data: false
      non_personal_data: true

metrics:
  - { name: "Module enrichment p-value", value: 0.003, range: "lower is better", dataset: "PanOmics-Proxy Cohort", split: other, split_detail: "Pathway enrichment against reference gene sets", higher_is_better: false }
  - { name: "Consensus stability (Jaccard)", value: 0.68, range: "0-1", dataset: "PanOmics-Proxy Cohort", split: bootstrap, split_detail: "100 bootstrap resamples", higher_is_better: true }
  - { name: "Planted-module recovery (ARI)", value: 0.81, range: "0-1", dataset: "SimOmics Synthetic Set", split: other, split_detail: "Recovery measured against known planted ground truth", higher_is_better: true }

limitations:
  known_limitations:
    - "Discovered subgroups are hypotheses, not validated clinical strata."
    - "Results depend on preprocessing and the omics layers included."
    - "Proxy/simulated data limit direct transfer to the target CVD population."
    - "No labels means no accuracy metric; validity is judged by stability and enrichment."
  groups_with_lower_performance:
    - "Omics layers with high missingness contribute weaker, less stable modules."

reproducibility:
  means_to_rerun:
    provided: true
    methods: ["R package", "requirements.txt", "README"]
  source_code:
    public: true
    url: "https://github.com/example-org/omicclust"
    scm_used: true
    license: "GPL-3.0"
  simulator_code:
    public: true
    url: "https://github.com/example-org/omicclust/tree/main/simomics"
  preprocessing_code:
    public: true
    url: "https://github.com/example-org/omicclust/tree/main/preprocessing"
  pretrained_model:
    provided: false
  execution_environment:
    platforms: ["Linux", "macOS"]
    computing_resources: "Runs on a regular workstation; large cohorts benefit from 32 GB RAM. No GPU required."

method_detail:
  hyperparameters: tuning
  overfitting:
    measures_taken: true
    methods: ["Consensus over resamples", "Stability selection"]
    details: "Modules retained only if stable across bootstrap resamples, reducing spurious structure."
  trigger_situations:
    checked: true
    details: "Tested sensitivity to batch effects and missingness on the proxy cohort."
  randomized_steps:
    checked: true
    details: "Consensus aggregation reduces run-to-run variation; reported Jaccard is the mean over 50 runs."
  baseline:
    compared: true
    details: "Compared against single-method k-means and hierarchical clustering."
  state_of_the_art:
    compared: true
    details: "Compared module recovery against a published multi-omics consensus-clustering method (MOSBi-style)."

# ── Gated: model_type = discovery → `discovery` module required ──
discovery:
  discovers: "Candidate patient subgroups and co-varying multi-omics biomarker modules."
  validation_method: "Bootstrap consensus stability, pathway-enrichment testing, and recovery of planted modules on simulated data."
  produces_decisions: false

# No `deployment`/`governance`: artifact_role is research_tool, and it makes no decisions about individuals.

# ── Optional: Epistasis — AIMe-only field (NOT rendered on the AI Card; feeds the AIMe entry). ──
# Applies here: a multi-omics model spanning several biological levels.
epistasis:
  multi_loci:
    has_measure: true
    description: "Ensemble biclustering captures the joint co-variation of multiple genomic loci within a discovered module, but does not quantify explicit pairwise epistatic interaction terms."
    convertible_to_or_rr: false
  biological_levels:
    multiple: true
    elaboration: "Integrates genomic, methylation, proteomic and metabolomic layers, so discovered modules can span several biological levels."
