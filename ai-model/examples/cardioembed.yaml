# yaml-language-server: $schema=../model-description.schema.json
#
# ─────────────────────────────────────────────────────────────────────────────
# ILLUSTRATIVE EXAMPLE — mock data for format evaluation.
# NOT a real model. Resembles a CVDLINK D4.1 "foundation / representation
# backbone" model. Allnnames, numbers, datasets and institutions are fictional.
#
# Type shown: REPRESENTATION model delivered as a REUSABLE COMPONENT
#   → activates the `representation` module (pretraining objective, embeddings,
#     downstream tasks) instead of `task`.
#   → NO deployment/governance: it is a backbone, not a system used on people.
# ─────────────────────────────────────────────────────────────────────────────

card_metadata:
  card_version: "1.0.0"
  card_language: en
  card_publisher: "CVDLINK Consortium"

identity:
  system_name: "EXAMPLE — CardioEmbed ECG Foundation Encoder"
  short_title: "EXAMPLE CardioEmbed"
  short_description: >-
    A self-supervised foundation encoder that turns 12-lead ECG signals into
    general-purpose embeddings for downstream cardiac tasks. Illustrative example
    of a reusable representation backbone, not a standalone predictor.
  version: "1.0.0"
  modality: software
  model_type: representation
  artifact_role: reusable_component
  ai_techniques:
    - "Self-supervised learning"
    - "Self-distillation (DINO-style)"
    - "Vision/Signal transformer"
    - "Representation learning"
  keywords:
    - ecg
    - foundation model
    - self-supervised
    - embeddings
    - representation learning

provenance:
  providers:
    - "CVDLINK Consortium"
  developers:
    - "Vantaa Signal Intelligence Group (example)"
  contacts:
    - name: "K. Nieminen (example)"
      institution: "Vantaa Signal Intelligence Group"
      email: "k.nieminen@example.org"
  funding: "EU Horizon Europe — CVDLINK (GA 101137278)"

intended:
  domain: "Healthcare — Cardiology (representation learning)"
  purpose: "Learn transferable ECG representations that downstream models fine-tune for diagnosis, risk and retrieval tasks; the encoder itself makes no clinical prediction."
  capability: "Self-supervised pretraining of a transformer encoder on large unlabeled 12-lead ECG corpora."
  out_of_scope_uses:
    - "Direct clinical prediction or diagnosis on its own"
    - "Use of raw embeddings as a clinical score"
    - "Deployment without a validated downstream task head"
  surrogate_marker:
    predicts: false
    details: "Outputs latent embeddings, not a prediction of any clinical outcome or surrogate."

io:
  input_description: "12-lead ECG signal (10 seconds, 500 Hz), or a variable-length Holter segment."
  output_description: "A fixed-length latent embedding vector (768-dim) representing the ECG."

components:
  - { name: "CardioEmbed-Backbone", type: model, version: "1.0.0", documentation_link: "internal://models/cardioembed-backbone/model-card" }
  - { name: "OpenECG-Corpus", type: dataset, version: "1.0.0", documentation_link: "internal://datasets/openecg-corpus/datasheet" }

data:
  datasets:
    - name: "OpenECG-Corpus"
      description: "Large unlabeled 12-lead ECG corpus (resting + Holter) used for self-supervised pretraining."
      cohort: >-
        Unselected hospital ECG archive: every adult patient with a recorded 12-lead ECG,
        regardless of indication, including non-cardiac admissions. Deliberately broad for
        pretraining, so no diagnostic inclusion criteria were applied.
      origin: real
      ethics_approval: true
      availability: restricted
      location_or_request: "Aggregated hospital ECG archive; accessible only under a data-use agreement."
      used_for_training: true
      bias_checked: true
      bias_details: "Reviewed device and demographic spread; pretraining corpus intentionally broad."
      n_samples: "1200000"
      n_features: "5000"
      preprocessing:
        - "Resampling to 500 Hz"
        - "Lead normalization"
      personal_data: true
      personal_data_category: "Health data (ECG recordings)"
      dpia_conducted: true
      non_personal_data: false
      anonymised: true
      licenced: true
    - name: "ECG-Probe (linear-probe eval)"
      description: "Public labeled multilabel ECG set used to evaluate embedding quality via linear probing."
      origin: real
      ethics_approval: true
      availability: public
      location_or_request: "Openly available benchmark dataset (fictional example)."
      used_for_training: false
      bias_checked: true
      bias_details: "Standard public diagnostic ECG benchmark; class balance documented upstream."
      n_samples: "21000"
      n_features: "5000"
      personal_data: false
      non_personal_data: true

metrics:
  - { name: "Linear-probe AUROC", value: 0.89, range: "0-1", dataset: "ECG-Probe (linear-probe eval)", split: other, split_detail: "Linear probe trained on frozen embeddings", higher_is_better: true }
  - { name: "Embedding kNN purity", value: 0.74, range: "0-1", dataset: "ECG-Probe (linear-probe eval)", split: other, split_detail: "kNN over frozen embeddings", higher_is_better: true }

limitations:
  known_limitations:
    - "Not a predictor: clinical usefulness depends entirely on the downstream head."
    - "Embeddings can encode dataset/device artefacts; downstream fine-tuning should audit for shortcut features."
    - "Pretraining corpus skews toward adult resting ECGs."
  groups_with_lower_performance:
    - "Pediatric ECGs (rare in the pretraining corpus)."
    - "Rare rhythm morphologies under-represented in pretraining."

reproducibility:
  means_to_rerun:
    provided: true
    methods: ["Dockerfile", "requirements.txt", "README"]
  source_code:
    public: true
    url: "https://github.com/example-org/cardioembed"
    scm_used: true
    license: "Apache-2.0"
  simulator_code:
    public: false
  preprocessing_code:
    public: true
    url: "https://github.com/example-org/cardioembed/tree/main/preprocessing"
  pretrained_model:
    provided: true
    url: "https://github.com/example-org/cardioembed/releases"
  execution_environment:
    platforms: ["Linux"]
    computing_resources: "Multi-GPU node (4×24 GB) for pretraining; a single GPU is enough to extract embeddings."

method_detail:
  hyperparameters: tuning
  overfitting:
    measures_taken: true
    methods: ["Large-scale pretraining", "Augmentation"]
    details: "Self-supervised objective with strong signal augmentations reduces memorisation; embedding quality tracked on a held-out probe set."
  trigger_situations:
    checked: false
    details: "Systematic confounder/shortcut analysis of embeddings is planned but not yet complete."
  randomized_steps:
    checked: true
    details: "Linear-probe AUROC varied <1% across pretraining seeds."
  baseline:
    compared: true
    details: "Compared embeddings against a supervised-from-scratch encoder of the same size."
  state_of_the_art:
    compared: true
    details: "Linear-probe results compared against a published contrastive ECG backbone."

# ── Gated: model_type = representation → `representation` module required ──
representation:
  pretraining_objective: "Self-distillation (student/teacher) on augmented views of unlabeled 12-lead ECG, plus a light supervised diagnostic head."
  embeds: "12-lead ECG waveforms into a 768-dimensional latent vector."
  downstream_tasks:
    - "Multilabel diagnostic ECG classification (fine-tuned head)"
    - "Cardiac risk / prognosis models (fine-tuned head)"
    - "Similar-case ECG retrieval"
  fine_tuning_methods:
    - "Linear probing"
    - "Low-rank adaptation (LoRA/DoRA)"
    - "Full fine-tuning with a task head"

# No `deployment`/`governance`: artifact_role is reusable_component, not standalone_system.

# ── Optional: Privacy — AIMe-only field (NOT rendered on the AI Card; feeds the AIMe entry). ──
# Applies here: a large self-supervised encoder can memorise fragments of its training data.
privacy:
  data_traces:
    possible: true
    elaboration: "A large self-supervised encoder can memorise fragments of training ECGs, so a membership-inference risk exists; it is assessed and monitored, but no differential privacy is applied during pretraining."
  federated:
    is_federated: false
    shared_data: "Pretraining is centralised on an aggregated, access-controlled ECG archive, not federated across nodes."
