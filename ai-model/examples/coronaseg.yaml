# yaml-language-server: $schema=../model-description.schema.json
#
# ─────────────────────────────────────────────────────────────────────────────
# ILLUSTRATIVE EXAMPLE — mock data for format evaluation.
# NOT a real model. Resembles a CVDLINK D4.1 "image segmentation / pipeline
# stage" model. All names, numbers, datasets and institutions are fictional.
#
# Type shown: predictive SEGMENTATION delivered as a PIPELINE STAGE
#   → activates the `task` module only (spatial metrics, uncapped values).
#   → NO deployment/governance: it is not a standalone system used on people;
#     it feeds downstream models.
# ─────────────────────────────────────────────────────────────────────────────

card_metadata:
  card_version: "1.0.0"
  card_language: en
  card_publisher: "CVDLINK Consortium"

identity:
  system_name: "EXAMPLE — CoronaSeg Coronary Artery Segmentation"
  short_title: "EXAMPLE CoronaSeg"
  short_description: >-
    A U-Net-based model that segments the coronary artery tree from X-ray
    coronary angiography frames. Illustrative example of a segmentation model
    used as a pipeline stage, not a clinical decision-maker.
  version: "1.0.0"
  modality: software
  model_type: segmentation
  artifact_role: pipeline_stage
  ai_techniques:
    - "Deep learning"
    - "2D U-Net (nnU-Net)"
    - "Topology-aware loss"
    - "Medical image segmentation"
  keywords:
    - cardiology
    - angiography
    - segmentation
    - coronary arteries
    - deep learning

provenance:
  providers:
    - "CVDLINK Consortium"
  developers:
    - "Northlake Medical Imaging Institute (example)"
  contacts:
    - name: "M. Rossi (example)"
      institution: "Northlake Medical Imaging Institute"
      email: "m.rossi@example.org"
  funding: "EU Horizon Europe — CVDLINK (GA 101137278)"

intended:
  domain: "Healthcare — Cardiac imaging"
  purpose: "Produce a pixel-level segmentation mask of the coronary artery tree from an angiography frame, as input to downstream stenosis-detection and risk models."
  capability: "Supervised semantic segmentation of X-ray coronary angiography images."
  out_of_scope_uses:
    - "Standalone clinical diagnosis"
    - "Direct treatment or intervention decisions"
    - "Non-coronary vascular imaging"
    - "Modalities other than X-ray angiography (e.g. CT, MRI)"
  surrogate_marker:
    predicts: false
    details: "Produces a segmentation mask, not a prediction of a clinical outcome or surrogate."

io:
  input_description: "Single-frame X-ray coronary angiography image (grayscale, 512×512)."
  output_description: >-
    A binary/multi-class segmentation mask of the coronary artery tree, at the same resolution
    as the input. Downstream stages derive vessel-level biomarkers from the mask, including
    vessel diameter and caliber.

components:
  - { name: "CoronaSeg-UNet", type: model, version: "1.0.0", documentation_link: "internal://models/coronaseg-unet/model-card" }
  - { name: "AngioSeg-Public Benchmark", type: dataset, version: "1.0.0", documentation_link: "internal://datasets/angioseg-public/datasheet" }

data:
  datasets:
    - name: "AngioSeg-Public Benchmark"
      description: "Public X-ray coronary angiography frames with expert coronary-tree segmentation masks."
      cohort: >-
        Patients referred for invasive coronary angiography on suspicion of coronary artery
        disease; every frame comes from a diagnosed patient and no healthy controls are
        included. Standard projection angles only.
      origin: real
      ethics_approval: true
      availability: public
      location_or_request: "Openly available benchmark dataset (fictional example)."
      used_for_training: true
      bias_checked: true
      bias_details: "Reviewed for acquisition-device and projection-angle spread; balanced across standard views."
      n_samples: "1800"
      n_features: "262144"
      preprocessing:
        - "Contrast normalization"
        - "Resize to 512×512"
      personal_data: false
      non_personal_data: true
    - name: "VascFrames-Ext (external)"
      description: "Independent public angiography set used only for external validation."
      origin: real
      ethics_approval: true
      availability: public
      location_or_request: "Openly available benchmark dataset (fictional example)."
      used_for_training: false
      bias_checked: true
      bias_details: "Different centre and vendor than the training set; used to test cross-site generalisation."
      n_samples: "600"
      n_features: "262144"
      personal_data: false
      non_personal_data: true

metrics:
  - { name: "Dice", value: 0.84, range: "0-1", dataset: "AngioSeg-Public Benchmark", split: held_out, split_detail: "20% held-out frames, split by patient", higher_is_better: true }
  - { name: "clDice", value: 0.80, range: "0-1", dataset: "AngioSeg-Public Benchmark", split: held_out, split_detail: "20% held-out frames, split by patient", higher_is_better: true }
  - { name: "IoU", value: 0.72, range: "0-1", dataset: "VascFrames-Ext (external)", split: external_validation, higher_is_better: true }
  - { name: "HD95 (px)", value: 6.1, range: "lower is better", dataset: "AngioSeg-Public Benchmark", split: held_out, split_detail: "20% held-out frames, split by patient", higher_is_better: false }

limitations:
  known_limitations:
    - "Segmentation quality drops on frames with heavy vessel overlap or poor contrast filling."
    - "Trained on standard projection angles; unusual views may degrade the mask."
    - "The mask is an intermediate artifact; downstream models must handle its uncertainty."
  groups_with_lower_performance:
    - "Frames from acquisition devices not represented in training."
    - "Distal, small-calibre vessel segments (thin structures)."

reproducibility:
  means_to_rerun:
    provided: true
    methods: ["Dockerfile", "requirements.txt", "README"]
  source_code:
    public: true
    url: "https://github.com/example-org/coronaseg"
    scm_used: true
    license: "MIT"
  simulator_code:
    public: false
  preprocessing_code:
    public: true
    url: "https://github.com/example-org/coronaseg/tree/main/preprocessing"
  pretrained_model:
    provided: true
    url: "https://github.com/example-org/coronaseg/releases"
  execution_environment:
    platforms: ["Linux"]
    computing_resources: "GPU with at least 12 GB VRAM for training; inference feasible on a mid-range GPU."

method_detail:
  hyperparameters: default
  overfitting:
    measures_taken: true
    methods: ["Cross-validation", "Data augmentation"]
    details: "nnU-Net default self-configuring pipeline with heavy geometric/intensity augmentation."
  trigger_situations:
    checked: true
    details: "Evaluated on low-contrast and overlapping-vessel frames to surface failure modes."
  randomized_steps:
    checked: true
    details: "Fold-to-fold Dice variation under 1.5%."
  baseline:
    compared: true
    details: "Compared against a vanilla 2D U-Net without the topology-aware loss."
  state_of_the_art:
    compared: true
    details: "Compared against a published Residual U-Net on the same public benchmark."

# ── Gated: predictive model_type (segmentation) → `task` required ──
task:
  prediction_target: "Per-pixel coronary artery tree segmentation mask."
  evaluation_protocol: "Held-out 20% partition of the public benchmark plus external validation on an independent set; Dice, clDice, IoU and HD95 reported."

# No `deployment`/`governance`: artifact_role is pipeline_stage, not standalone_system.
