# yaml-language-server: $schema=../model-description.schema.json
#
# ─────────────────────────────────────────────────────────────────────────────
# ILLUSTRATIVE EXAMPLE — mock data for format evaluation.
# NOT a real model. Resembles a CVDLINK D4.1 "object detection / pipeline stage"
# model. All names, numbers, datasets and institutions are fictional.
#
# Type shown: predictive DETECTION delivered as a PIPELINE STAGE
#   → activates the `task` module only (detection metrics: mAP, precision/recall;
#     bounding-box output).
#   → NO deployment/governance: it is not a standalone system used on people.
# ─────────────────────────────────────────────────────────────────────────────

card_metadata:
  card_version: "1.0.0"
  card_language: en
  card_publisher: "CVDLINK Consortium"

identity:
  system_name: "EXAMPLE — StenoScan Stenosis Detector"
  short_title: "EXAMPLE StenoScan"
  short_description: >-
    An object-detection model that localises coronary stenoses in X-ray
    angiography frames with bounding boxes. Illustrative example of a detection
    model used as a pipeline stage.
  version: "1.0.0"
  modality: software
  model_type: detection
  artifact_role: pipeline_stage
  ai_techniques:
    - "Deep learning"
    - "Object detection (YOLO)"
    - "Real-time detection transformer (RT-DETR)"
    - "Medical image analysis"
  keywords:
    - cardiology
    - angiography
    - stenosis
    - object detection
    - localization

provenance:
  providers:
    - "CVDLINK Consortium"
  developers:
    - "Northlake Medical Imaging Institute (example)"
  contacts:
    - name: "M. Rossi (example)"
      institution: "Northlake Medical Imaging Institute"
      email: "m.rossi@example.org"
  funding: "EU Horizon Europe — CVDLINK (GA 101137278)"

intended:
  domain: "Healthcare — Cardiac imaging"
  purpose: "Detect and localise coronary artery stenoses in an angiography frame, flagging candidate regions for a clinician and downstream severity assessment."
  capability: "Supervised object detection producing bounding boxes with confidence scores."
  out_of_scope_uses:
    - "Autonomous diagnosis of stenosis severity"
    - "Treatment or intervention decisions without clinician review"
    - "Quantitative flow or fractional-flow-reserve estimation"
    - "Modalities other than X-ray angiography"
  surrogate_marker:
    predicts: false
    details: "Outputs candidate stenosis locations, not a clinical outcome or surrogate marker."

io:
  input_description: "Single-frame X-ray coronary angiography image (grayscale, 512×512)."
  output_description: >-
    A list of bounding boxes around candidate stenoses, each with a confidence score.
    Downstream stages use the boxes to localise lesions for per-segment severity scoring.

components:
  - { name: "StenoScan-Detector", type: model, version: "1.0.0", documentation_link: "internal://models/stenoscan-detector/model-card" }
  - { name: "StenoBox Benchmark", type: dataset, version: "1.0.0", documentation_link: "internal://datasets/stenobox/datasheet" }

data:
  datasets:
    - name: "StenoBox Benchmark"
      description: "Public angiography frames annotated with expert bounding boxes around coronary stenoses."
      cohort: >-
        Patients undergoing invasive coronary angiography for suspected or known coronary
        artery disease. Frames were selected where at least one lesion is annotated, so
        healthy vessels are under-represented relative to routine practice.
      origin: real
      ethics_approval: true
      availability: public
      location_or_request: "Openly available benchmark dataset (fictional example)."
      used_for_training: true
      bias_checked: true
      bias_details: "Reviewed for lesion-location and vessel spread; left/right dominance balanced."
      n_samples: "2400"
      n_features: "262144"
      preprocessing:
        - "Contrast normalization"
        - "Resize to 512×512"
      personal_data: false
      non_personal_data: true
    - name: "AngioLesion-Ext (external)"
      description: "Independent public detection set used only for external validation."
      origin: real
      ethics_approval: true
      availability: public
      location_or_request: "Openly available benchmark dataset (fictional example)."
      used_for_training: false
      bias_checked: true
      bias_details: "Different centre than training; per-site mAP reported."
      n_samples: "700"
      n_features: "262144"
      personal_data: false
      non_personal_data: true

metrics:
  - { name: "mAP@0.5", value: 0.62, range: "0-1", dataset: "StenoBox Benchmark", split: held_out, split_detail: "20% held-out frames, split by patient", higher_is_better: true }
  - { name: "mAP@0.5:0.95", value: 0.41, range: "0-1", dataset: "StenoBox Benchmark", split: held_out, split_detail: "20% held-out frames, split by patient", higher_is_better: true }
  - { name: "Precision", value: 0.69, range: "0-1", dataset: "StenoBox Benchmark", split: held_out, split_detail: "20% held-out frames, split by patient", higher_is_better: true }
  - { name: "Recall", value: 0.65, range: "0-1", dataset: "StenoBox Benchmark", split: held_out, split_detail: "20% held-out frames, split by patient", higher_is_better: true }
  - { name: "mAP@0.5", value: 0.55, range: "0-1", dataset: "AngioLesion-Ext (external)", split: external_validation, higher_is_better: true }

limitations:
  known_limitations:
    - "Misses very subtle or diffuse stenoses that lack a sharp bounding region."
    - "Confidence scores are not calibrated to clinical severity."
    - "Overlapping vessels can produce false positives."
    - "Single-frame only; does not use the temporal angiography sequence."
  groups_with_lower_performance:
    - "Distal, small-calibre vessel segments."
    - "Frames with heavy contrast pooling or overlap."

reproducibility:
  means_to_rerun:
    provided: true
    methods: ["Dockerfile", "requirements.txt", "README"]
  source_code:
    public: true
    url: "https://github.com/example-org/stenoscan"
    scm_used: true
    license: "AGPL-3.0"
  simulator_code:
    public: false
  preprocessing_code:
    public: true
    url: "https://github.com/example-org/stenoscan/tree/main/preprocessing"
  pretrained_model:
    provided: true
    url: "https://github.com/example-org/stenoscan/releases"
  execution_environment:
    platforms: ["Linux"]
    computing_resources: "GPU with at least 12 GB VRAM for training; near real-time inference on a single GPU."

method_detail:
  hyperparameters: tuning
  overfitting:
    measures_taken: true
    methods: ["Data augmentation", "Early stopping"]
    details: "Mosaic/affine augmentation with early stopping on the validation mAP."
  trigger_situations:
    checked: true
    details: "Evaluated false-positive rate on overlapping-vessel and low-contrast frames."
  randomized_steps:
    checked: true
    details: "mAP varied by ~2% across training seeds."
  baseline:
    compared: true
    details: "Compared a YOLOv8 backbone against an RT-DETR backbone."
  state_of_the_art:
    compared: true
    details: "Benchmarked against a published Faster R-CNN detector on the same set."

# ── Gated: predictive model_type (detection) → `task` required ──
task:
  prediction_target: "Bounding boxes around candidate coronary stenoses, with confidence scores."
  evaluation_protocol: "Held-out split plus external validation; mAP@0.5, mAP@0.5:0.95, precision and recall reported."

# No `deployment`/`governance`: artifact_role is pipeline_stage, not standalone_system.
