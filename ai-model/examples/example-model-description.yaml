# yaml-language-server: $schema=../model-description.schema.json
#
# ▸ Make sure the "YAML" extension by Red Hat is installed.
# ▸ It is validated live against model-description.schema.json.
#

card_metadata:
  card_version: "1.0.0"
  card_language: en
  card_publisher: "CVDLINK Consortium"

identity:
  system_name: "EXAMPLE — CVDLINK ECG-based Sudden Cardiac Death Predictor"
  short_title: "EXAMPLE ECG-SCD"
  short_description: >-
    A deep learning model that predicts short-term (30-day) risk of sudden cardiac
    death from 12-lead ECG signals. Illustrative example filling the whole model description.
  version: "1.0.0"
  modality: software
  model_type: classification
  artifact_role: standalone_system
  ai_techniques:
    - "Deep learning"
    - "Convolutional neural network (1D CNN)"
    - "ECG signal processing"
  keywords:
    - cardiology
    - ecg
    - sudden cardiac death
    - deep learning
    - risk prediction

provenance:
  providers:
    - "CVDLINK Consortium"
  developers:
    - "University of Eastern Finland, AI Research Group"
  contacts:
    - name: "A. Virtanen (example)"
      institution: "Northlake Cardiology Research Unit"
      email: "a.virtanen@example.org"
      orcid: "0000-0002-1825-0097"
  funding: "EU Horizon Europe — CVDLINK (GA 101137278)"
  paper_url: "https://doi.org/10.5281/zenodo.0000000"

intended:
  domain: "Healthcare — Cardiology"
  purpose: "Predict the short-term (30-day) risk of sudden cardiac death for a patient from a 12-lead ECG recording."
  capability: "Supervised time-series classification on 12-lead ECG waveforms."
  out_of_scope_uses:
    - "Pediatric patients (under 18)"
    - "Real-time monitoring or acute alarms"
    - "Autonomous clinical decision-making without physician review"
    - "Patients with pacemakers or implanted cardiac devices"
  surrogate_marker:
    predicts: false
    details: "The model predicts the true clinical endpoint (sudden cardiac death) directly rather than a surrogate marker."

io:
  input_description: "12-lead ECG signal (10 seconds, 500 Hz sampling rate)."
  output_description: "30-day SCD risk score in [0,1] with a confidence interval."

components:
  - { name: "ECG-SignalNet", type: model, version: "1.0.0", documentation_link: "internal://models/ecg-signalnet/model-card" }
  - { name: "FinnECG-SCD Dataset", type: dataset, version: "3.2.0", documentation_link: "internal://datasets/finn-ecg-scd/datasheet" }
  - { name: "ECG Preprocessing Pipeline", type: system, version: "2.1.0", documentation_link: "internal://systems/ecg-preprocess/docs" }

data:
  datasets:
    - name: "FinnECG-SCD Dataset"
      description: "12-lead ECG waveforms with linked 30-day sudden-cardiac-death outcome labels from Finnish hospital records."
      cohort: >-
        Adults aged 18-90 with a resting 12-lead ECG recorded during a hospital contact,
        covering both cardiac and non-cardiac admissions. Single national healthcare system
        (Finland). No paediatric patients and no patients with implanted cardiac devices.
      origin: real
      ethics_approval: true
      availability: on_request
      location_or_request: "Available to approved researchers via the CVDLINK Secure Processing Environment after data-access-committee review."
      used_for_training: true
      bias_checked: true
      bias_details: "Checked for demographic representation across age and sex; no major imbalance found."
      n_samples: "50000"
      n_features: "5000"
      preprocessing:
        - "Normalization"
        - "Missing-data handling"
      personal_data: true
      personal_data_category: "Health data (ECG recordings)"
      dpia_conducted: true
      non_personal_data: false
      anonymised: true
      licenced: true

metrics:
  - { name: "AUC-ROC", value: 0.78, range: "0-1", dataset: "FinnECG-SCD Dataset", split: held_out, split_detail: "20% held-out test partition, split by patient", higher_is_better: true }
  - { name: "F1",      value: 0.63, range: "0-1", dataset: "FinnECG-SCD Dataset", split: held_out, split_detail: "20% held-out test partition, split by patient", higher_is_better: true }

limitations:
  known_limitations:
    - "Trained primarily on a Finnish population — generalisability to other populations not yet validated."
    - "Performance degrades on poor-quality ECG signals (noise, lead detachment)."
    - "Not validated for patients with pacemakers or implanted cardiac devices."
    - "30-day prediction window — not suitable for real-time acute risk alerting."
  groups_with_lower_performance:
    - "Patients under 40 (under-represented in training data)."
    - "Patients with atrial fibrillation (differing signal characteristics)."
    - "Female patients over 70 (lower AUC: 0.71 vs 0.78 overall)."

reproducibility:
  means_to_rerun:
    provided: true
    methods: ["Dockerfile", "requirements.txt"]
  source_code:
    public: true
    url: "https://github.com/cvdlink/ecg-scd"
    scm_used: true
    license: "Apache-2.0"
  simulator_code:
    public: false
  preprocessing_code:
    public: true
    url: "https://github.com/cvdlink/ecg-scd/tree/main/preprocessing"
  pretrained_model:
    provided: false
  execution_environment:
    platforms: ["Linux"]
    computing_resources: "A GPU with at least 16 GB VRAM is required for training; inference runs on a regular CPU."

method_detail:
  hyperparameters: tuning
  overfitting:
    measures_taken: true
    methods: ["Cross-validation", "Regularization"]
    details: "5-fold cross-validation combined with L2 weight regularization."
  trigger_situations:
    checked: false
    details: "Confounder-induced failure modes have not yet been systematically evaluated in this version."
  randomized_steps:
    checked: true
    details: "Fixed random seeds; variation across seeds was below 1% AUC."
  baseline:
    compared: true
    details: "Compared against a logistic-regression baseline."
  state_of_the_art:
    compared: false
    details: "No published state-of-the-art benchmark exists for 30-day SCD prediction from a single 12-lead ECG at time of development."

# ── Gated module: predictive model_type → `task` is required ──
task:
  prediction_target: "Binary 30-day sudden-cardiac-death risk (high vs low)."
  evaluation_protocol: "Held-out 20% test partition, reporting AUC-ROC and F1; 5-fold cross-validation used for model selection during development."

# ── Gated module: artifact_role = standalone_system → `deployment` + `governance` required ──
deployment:
  deployer: "Hospital cardiology departments within the EU"
  ai_subject: "Adult patients (age 30–80) undergoing routine 12-lead ECG"
  automation_level: human_in_the_loop
  human_oversight: "A cardiologist reviews every SCD risk score alongside clinical history before any decision; the model never triggers action autonomously."
  actors:
    - { role: "Cardiologist", intended: true, active: true,  informed: true, control: correct }
    - { role: "Patient", intended: true, active: false, informed: true, control: challenge }
    - { role: "Primary care physician", intended: true, active: true, informed: true, control: opt_out }
  risk_profile:
    risks:
      - impact_area: health_and_safety
        likelihood: medium
        severity: very_high
        residual_risk: medium
        mitigations: ["Decision-support only", "Clinician confirmation required", "Continuous performance monitoring"]
      - impact_area: fundamental_rights
        likelihood: low
        severity: high
        residual_risk: low
        mitigations: ["Bias auditing across age and sex", "Patient transparency", "Human-in-the-loop"]
      - impact_area: society
        likelihood: low
        severity: low
        residual_risk: low
        mitigations: ["Equity monitoring across deployment sites"]
      - impact_area: environment
        likelihood: low
        severity: low
        residual_risk: low
        mitigations: ["Efficient CPU inference"]

governance:
  regulations:
    - { name: "EU AI Act", jurisdiction: "EU", assessment_type: "High-risk (Annex III, medical) — conformity assessment pending" }
    - { name: "GDPR", jurisdiction: "EU", assessment_type: "DPIA conducted" }
    - { name: "EU MDR", jurisdiction: "EU", assessment_type: "Class IIa (provisional)" }
  standards:
    - { name: "ISO/IEC 42001", year: "2023", certifiable: true }
    - { name: "ISO 14971", year: "2019", certifiable: true }
    - { name: "ISO/IEC 27001", year: "2022", certifiable: true }
  codes_of_conduct:
    - "CVDLINK Responsible AI Guidelines"
    - "Declaration of Helsinki"

predetermined_changes:
  - { subject: "ECG-SignalNet model weights", frequency: "6 months", impact_on_performance: true,  impact_on_risks: true }
  - { subject: "Training dataset refresh", frequency: "12 months", impact_on_performance: true,  impact_on_risks: true }
  - { subject: "Risk-mitigation review", frequency: "3 months", impact_on_performance: false, impact_on_risks: true }

# ── Optional: Privacy — fill in only if it applies (relevant to CVDLINK federated training) ──
privacy:
  data_traces:
    possible: true
    elaboration: "Model weights could in principle retain traces of individual training ECGs; membership-inference risk was assessed as low after differentially private training."
    techniques: ["Differential privacy"]
  federated:
    is_federated: true
    shared_data: "Encrypted model gradient updates only; no raw ECG signals leave each hospital node."
    communication: star_based
    privacy_techniques: ["Secure multi-party computation (SMPC)", "Differential privacy"]
    transmission_ratio: constant

# ── Optional: Epistasis — genomics/multi-omics models only; not applicable to an ECG model ──
epistasis:
  multi_loci:
    has_measure: false
    description: "Not applicable — the model uses ECG waveform signals, not genomic loci."
    convertible_to_or_rr: false
  biological_levels:
    multiple: false
    elaboration: "Single modality (electrophysiological signal); no multi-omics biological levels are modelled."
